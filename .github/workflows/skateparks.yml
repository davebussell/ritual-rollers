# Refreshes data/skateparks.json (every skatepark in OpenStreetMap for CA, US, MX).
# Run it from the Actions tab ("Run workflow") when you want fresh map data. On main a refresh
# commit deploys the site, like any other push.
name: Refresh skateparks

on:
  workflow_dispatch:
  push:
    branches: [skate]
    paths:
      - scripts/fetch-skateparks.mjs
      - .github/workflows/skateparks.yml

permissions:
  contents: write

concurrency:
  group: skateparks
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-skateparks.mjs
      - name: Commit the data if it changed
        run: |
          git config user.name "ritualrollers-bot"
          git config user.email "dave@clickshift.ca"
          git add data/skateparks.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Refresh skateparks from OpenStreetMap"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
